name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Briefcase and developer tools (Windows)
        if: matrix.os == 'windows-latest'
        run: pip install briefcase==0.4.2 pytest

      - name: Install Briefcase, dmgbuild, and developer tools (macOS)
        if: matrix.os == 'macos-latest'
        run: pip install briefcase==0.4.2 dmgbuild pytest

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pytest tests/ -v `
            --ignore=tests/test_macapp.py `
            -k "not textutil and not Darwin"

      - name: Run unit tests (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python -m pytest tests/ -v

      - name: Create Briefcase application package
        run: briefcase create ${{ matrix.os == 'windows-latest' && 'windows' || 'macOS' }}

      - name: Build application
        run: briefcase build ${{ matrix.os == 'windows-latest' && 'windows' || 'macOS' }} ${{ matrix.os == 'macos-latest' && '--adhoc-sign' || '' }}

      - name: Package application installer (Windows MSI)
        if: matrix.os == 'windows-latest'
        run: briefcase package windows

      - name: Package application installer (macOS DMG)
        if: matrix.os == 'macos-latest'
        run: python scripts/package_dmg.py

      - name: Upload packaged installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-cleaner-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List downloaded installers
        run: ls -lh dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-dev' }}
          release_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '手動測試版本 (Manual Build)' }}
          generate_release_notes: true
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
